name: Deploy C-API

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)publish. Use this to complete a release
          whose tag-triggered run failed partway.
        required: true
        type: string

permissions:
  contents: write

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::Tag must be specified."
            exit 1
          fi
          if [ "$IS_DISPATCH" = "true" ]; then
            if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist in the repository."
              exit 1
            fi
          fi
      - name: Check if already published
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          if [ "$STATUS" = "200" ]; then
            echo "::error::GitHub Release for tag '$TAG' is already published."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION_WORKFLOWS }}
      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
      - name: Install task runner
        run: pip install poethepoet
      - name: Bump versions
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          poetry install --only version
          poe bump-version
      - name: Upload patched Cargo files
        uses: actions/upload-artifact@v4
        with:
          name: patched-cargo
          path: |
            Cargo.toml
            crates/**/Cargo.toml

  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    needs: [set-version]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-latest
          - name: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Download patched Cargo files
        uses: actions/download-artifact@v4
        with:
          name: patched-cargo
          path: .
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-c (Pre-built)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c
      - name: Build the C-API (dist)
        run: |
          cargo cinstall --release -p ekore_capi --destdir=./crates/ekore_capi/dist --prefix=/ --libdir=/lib --includedir=/include
      - name: Verify the dist by running the C/C++ test suite against it
        run: ./crates/ekore_capi/tests/run_tests.sh
      - name: Package dist
        id: package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          archive="ekore_capi-${TAG}-${{ matrix.platform.name }}.tar.gz"
          tar -C crates/ekore_capi/dist -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ekore_capi-${{ matrix.platform.name }}
          path: ${{ steps.package.outputs.archive }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: ekore_capi-*
          merge-multiple: true
          path: dist-artifacts
      - name: Generate checksums
        working-directory: dist-artifacts
        run: sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/SHA256SUMS.txt
