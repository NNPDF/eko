name: Deploy C-API

on:
  push:
    tags:
      - 'v[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)publish. Use this to complete a release
          whose tag-triggered run failed partway.
        required: false

permissions:
  contents: write

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION_WORKFLOWS }}
      - name: Install tomlkit
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        run: pip install tomlkit
      - name: Bump versions
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python crates/bump-versions.py ${{ env.TAG }}
      - name: Upload patched Cargo files
        uses: actions/upload-artifact@v4
        with:
          name: patched-cargo
          path: |
            Cargo.toml
            crates/**/Cargo.toml

  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    needs: [set-version]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-latest
          - name: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download patched Cargo files
        uses: actions/download-artifact@v4
        with:
          name: patched-cargo
          path: .
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-c (Pre-built)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c
      - name: Build the C-API (dist)
        run: |
          cargo cinstall --release -p ekore_capi --destdir=./crates/ekore_capi/dist --prefix=/ --libdir=/lib --includedir=/include
      - name: Verify the dist by running the C/C++ test suite against it
        run: ./crates/ekore_capi/tests/run_tests.sh
      - name: Package dist
        id: package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          archive="ekore_capi-${TAG}-${{ matrix.platform.name }}.tar.gz"
          tar -C crates/ekore_capi/dist -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ekore_capi-${{ matrix.platform.name }}
          path: ${{ steps.package.outputs.archive }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: ekore_capi-*
          merge-multiple: true
          path: dist-artifacts
      - name: Generate checksums
        working-directory: dist-artifacts
        run: sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/SHA256SUMS.txt
