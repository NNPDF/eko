name: Deploy Crates

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)publish. Use this to complete a release
          whose tag-triggered run failed partway.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
      - name: Install task runner
        run: pip install poethepoet
      - name: Bump versions
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          poetry install --only version
          python crates/bump-versions.py ${{ env.TAG }}
      - name: Publish crates
        run: |
          jq '.[]' crates/release.json | xargs -I _ cargo publish -p _ --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
